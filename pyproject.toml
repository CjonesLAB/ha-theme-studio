[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
  ".pytest-*-temp",
  ".tmp-*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/check_single_design_standalone.py" = ["E402"]
