name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Testabhängigkeiten installieren
        run: python -m pip install --requirement requirements_test.txt

      - name: Python-Dateien prüfen
        run: python -m compileall -q custom_components/theme_studio

      - name: JavaScript-Dateien prüfen
        run: |
          node --check custom_components/theme_studio/frontend/theme-studio-panel.js
          node --check custom_components/theme_studio/frontend/theme-studio-effects.js

      - name: Automatisierte Tests ausführen
        run: python -m pytest
